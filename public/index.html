<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo Keep</title>
<link rel="stylesheet" href="/css/styles.css" />
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem('todoKeepTheme') || 'light';
  } catch {}
</script>
</head>
<body>
  <div class="home">
    <div style="width:100%; max-width:460px; display:flex; justify-content:flex-end; margin-bottom:8px;">
      <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle theme">🌙</button>
    </div>
    <div class="home-card">
      <h1>📝 Todo Keep</h1>
      <p class="subtitle">Create a shareable todo board and collaborate with anyone who has the link — no sign up needed.</p>
      <form id="create-form">
        <input id="board-title" type="text" placeholder="Board name (e.g. Team Sprint, Grocery List)" autocomplete="off" />
        <button type="submit">Create board</button>
      </form>

      <div class="divider"><span>or</span></div>

      <form id="join-form">
        <input id="board-link" type="text" placeholder="Board name, link, or ID" autocomplete="off" />
        <button type="submit" class="secondary">Open board</button>
      </form>
      <p id="join-status" class="join-status" hidden></p>
      <ul id="join-results" class="join-results" hidden></ul>
    </div>

    <div id="my-boards" class="my-boards" hidden>
      <h2>Your boards</h2>
      <ul id="my-boards-list"></ul>
    </div>
  </div>
  <script src="/js/theme.js"></script>
  <script src="/js/my-boards.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
